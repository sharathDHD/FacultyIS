# Version: v2.15
[project]
name = "facultyis"
version = "2.16.0"
description = "Faculty Information System — Flask analytics API"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "PyJWT==2.9.0",
    "gunicorn==22.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["flask-api"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["config", "models", "routes", "ratelimit", "auth"]

[tool.ruff.format]
quote-style = "double"
